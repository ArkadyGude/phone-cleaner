<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Очистка номеров телефонов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 2rem auto;
            padding: 1rem;
        }
        input, button {
            font-size: 1rem;
            padding: 0.5rem;
            margin: 0.5rem 0;
        }
        .result {
            margin-top: 1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Очистка номеров телефонов</h1>
    <label for="phoneInput">Введите номер:</label>
    <input type="text" id="phoneInput" placeholder="8 (927) 000-00-00">
    <button id="cleanBtn">Очистить</button>
    <div class="result" id="result"></div>

    <script src="bundle.js"></script>
</body>
</html>
